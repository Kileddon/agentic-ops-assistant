services:
  api:
    build: .
    command: uvicorn agentic_ops_assistant.api:create_app_from_environment --factory --host 0.0.0.0 --port 8000
    env_file: .env.local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./examples:/app/examples:ro
      - ./var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  alert-relay:
    build: .
    command: uvicorn agentic_ops_assistant.alert_relay:create_alert_relay_from_environment --factory --host 0.0.0.0 --port 8001
    env_file: .env.local
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
