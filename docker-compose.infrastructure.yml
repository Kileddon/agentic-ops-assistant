services:
  redis:
    image: redis:8.2
    ports:
      - "127.0.0.1:6379:6379"

  prometheus:
    image: prom/prometheus:v3.8.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./examples/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - ./var/prometheus-scrape-token:/run/secrets/prometheus-scrape-token:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./examples/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./var/alert-webhook-token:/run/secrets/alert-webhook-token:ro
