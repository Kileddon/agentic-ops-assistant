[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ops-assistant"
version = "0.1.0"
description = "Secure agentic RAG operations assistant."
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "openai>=3.3.1",
    "pyjwt[crypto]>=2.12.1",
    "redis>=7.2.0",
]

[project.scripts]
ops-search = "agentic_ops_assistant.cli:main"
ops-status = "agentic_ops_assistant.status_cli:main"
ops-investigate = "agentic_ops_assistant.investigation_cli:main"
ops-summarize = "agentic_ops_assistant.summarization_cli:main"
ops-semantic-search = "agentic_ops_assistant.semantic_search_cli:main"
ops-evaluate-retrieval = "agentic_ops_assistant.retrieval_evaluation_cli:main"
ops-prometheus-status = "agentic_ops_assistant.prometheus_status_cli:main"
ops-prune-audit = "agentic_ops_assistant.audit_retention_cli:main"
ops-collect-diagnostics = "agentic_ops_assistant.diagnostics_cli:main"
ops-archive-audit = "agentic_ops_assistant.audit_archive_cli:main"
ops-backup-audit = "agentic_ops_assistant.audit_backup_cli:main"
ops-backup-latest-audit = "agentic_ops_assistant.audit_backup_latest_cli:main"
ops-restore-audit = "agentic_ops_assistant.audit_restore_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = ["src"]
strict = true
