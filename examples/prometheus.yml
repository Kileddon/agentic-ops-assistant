global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: agentic-ops-assistant
    metrics_path: /metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus-scrape-token
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: demo-unreachable
    static_configs:
      - targets: ["host.docker.internal:65535"]
